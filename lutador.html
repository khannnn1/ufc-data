<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lutador — UFC Data</title>
<link rel="stylesheet" href="css/site.css?v=1">
<style>
  main { max-width: var(--largura); margin: 0 auto; padding: 28px 16px 40px; }
  .carregando, .erro { color: var(--muted); padding: 40px 0; text-align: center; }

  .cartao-p {
    background: var(--card-bg); border: 1px solid var(--grid-line); border-radius: var(--raio);
    padding: 18px 20px;
  }
  .cartao-p h2 {
    font-size: 0.78rem; font-weight: 700; color: var(--muted);
    text-transform: uppercase; letter-spacing: 0.05em; margin: 0 0 14px;
  }

  /* Topo do perfil */
  .perfil-topo { display: flex; gap: 24px; align-items: center; margin-bottom: 16px; }
  .perfil-topo .titulo { min-width: 0; flex: 1; }
  .perfil-topo h1 { font-size: 1.9rem; margin: 0; line-height: 1.15; }
  .perfil-topo .sub { color: var(--muted); margin-top: 4px; }
  .perfil-topo .cartel-grande { font-size: 2.2rem; font-weight: 800; margin-top: 6px; font-variant-numeric: tabular-nums; }
  .perfil-topo .cartel-grande small { font-size: 0.8rem; font-weight: 600; color: var(--muted); margin-left: 8px; letter-spacing: 0.04em; text-transform: uppercase; }
  .botao {
    display: inline-block; padding: 8px 16px; border-radius: 8px; font-weight: 600; font-size: 0.9rem;
    background: var(--vermelho); color: var(--text); text-decoration: none; white-space: nowrap;
  }
  .botao:hover { filter: brightness(1.1); }

  .fatos { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 1px; background: var(--grid-line);
           border: 1px solid var(--grid-line); border-radius: var(--raio); overflow: hidden; margin-bottom: 16px; }
  .fato { background: var(--card-bg); padding: 12px 14px; }
  .fato .rotulo { color: var(--muted); font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.05em; }
  .fato .valor { font-weight: 700; font-size: 1.05rem; margin-top: 2px; }
  .fato .valor.vitoria { color: #4cc285; }
  .fato .valor.derrota { color: var(--vermelho); }

  .grade { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.4fr); gap: 16px; margin-bottom: 16px; }

  /* Como vence / como perde */
  .metodos .linha-metodo { margin-bottom: 14px; }
  .metodos .cabecalho { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 2px 12px; font-size: 0.88rem; margin-bottom: 6px; }
  .metodos .cabecalho span:last-child { color: var(--muted); }
  .empilhada { display: flex; height: 12px; border-radius: 6px; overflow: hidden; background: var(--grid-line); }
  .empilhada span { display: block; height: 100%; }
  .legenda { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 0.8rem; color: var(--muted); margin-top: 4px; }
  .legenda i { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 5px; vertical-align: -1px; }
  .cor-ko { background: var(--azul); }
  .cor-sub { background: var(--vermelho); }
  .cor-dec { background: var(--amarelo); }
  .cor-outro { background: #555; }

  /* Estatísticas × média da categoria */
  .estat { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 2px 12px; align-items: center; padding: 8px 0; border-bottom: 1px solid var(--grid-line); }
  .estat:last-of-type { border-bottom: none; }
  .estat .rotulo { font-size: 0.88rem; }
  .estat .valor { font-weight: 700; text-align: right; font-variant-numeric: tabular-nums; }
  .estat .trilho { grid-column: 1 / -1; position: relative; height: 6px; background: var(--grid-line); border-radius: 3px; margin-top: 4px; }
  .estat .trilho .preenchido { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 3px; background: var(--azul); }
  .estat .trilho .preenchido.acima { background: #4cc285; }
  .estat .trilho .media { position: absolute; top: -3px; width: 2px; height: 12px; background: var(--text); opacity: 0.8; }
  .estat .comparacao { grid-column: 1 / -1; color: var(--muted); font-size: 0.75rem; }
  .nota { color: var(--muted); font-size: 0.8rem; margin: 10px 0 0; }

  /* Histórico de lutas */
  .resultado {
    display: inline-flex; align-items: center; justify-content: center;
    width: 28px; height: 28px; border-radius: 6px; font-weight: 800; font-size: 0.8rem;
  }
  .resultado.W { background: rgba(42, 157, 92, 0.18); color: #4cc285; }
  .resultado.L { background: rgba(230, 57, 70, 0.18); color: #ff6b76; }
  .resultado.D, .resultado.NC { background: #262626; color: var(--muted); }
  .adversario { display: flex; align-items: center; gap: 10px; min-width: 0; }
  table.historico td { white-space: normal; vertical-align: middle; }
  table.historico td.metodo { min-width: 120px; }
  td.metodo .principal { font-weight: 600; }
  .etiqueta {
    display: inline-block; font-size: 0.68rem; font-weight: 700; letter-spacing: 0.03em; text-transform: uppercase;
    padding: 1px 6px; border-radius: 4px; margin: 3px 4px 0 0; color: var(--bg);
  }
  .etiqueta.cinturao { background: var(--amarelo); }
  .etiqueta.bonus { background: var(--muted); }
  td.golpes { color: var(--muted); }
  td.golpes strong { color: var(--text); }
  .filtros-historico { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 8px; }
  .filtros-historico button {
    background: transparent; color: var(--muted); border: 1px solid var(--grid-line); border-radius: 16px;
    padding: 4px 12px; font: inherit; font-size: 0.82rem; cursor: pointer;
  }
  .filtros-historico button[aria-pressed="true"] { color: var(--text); border-color: var(--text); }

  @media (max-width: 860px) {
    .fatos { grid-template-columns: repeat(3, minmax(0, 1fr)); }
    .grade { grid-template-columns: minmax(0, 1fr); }
  }
  @media (max-width: 560px) {
    .perfil-topo { gap: 16px; align-items: flex-start; flex-wrap: wrap; }
    .perfil-topo .avatar.enorme { width: 84px; height: 84px; font-size: 1.5rem; }
    .perfil-topo h1 { font-size: 1.45rem; }
    .perfil-topo .cartel-grande { font-size: 1.7rem; }
    .perfil-topo .acoes { width: 100%; }
    .col-golpes { display: none; }
    .perfil-topo .cartel-grande small { display: none; }
    .cartao-p { padding: 14px; }
  }
</style>
</head>
<body data-pagina="lutador">

<main id="perfil">
  <p class="carregando">Carregando…</p>
</main>

<footer>
  Projeto de <a href="https://github.com/khannnn1/ufc-data">código aberto no GitHub</a> · Dados de <a href="http://ufcstats.com">ufcstats.com</a> · Fotos de <a href="https://www.ufc.com">ufc.com</a>
</footer>

<script src="js/site.js?v=1"></script>
<script src="js/lutador.js?v=1"></script>
</body>
</html>
