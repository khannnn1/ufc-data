<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Eventos — UFC Data</title>
<meta name="description" content="Todos os eventos do UFC desde 1994, com o card completo de cada um: resultados, métodos, bônus e estatísticas.">
<meta name="theme-color" content="#0d0d0d">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="img/icone-180.png">
<meta property="og:type" content="website">
<meta property="og:site_name" content="UFC Data">
<meta property="og:locale" content="pt_BR">
<meta property="og:title" content="Eventos — UFC Data">
<meta property="og:description" content="Todos os eventos do UFC desde 1994, com o card completo de cada um: resultados, métodos, bônus e estatísticas.">
<meta property="og:url" content="https://khannnn1.github.io/ufc-data/eventos.html">
<meta property="og:image" content="https://khannnn1.github.io/ufc-data/img/og.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">

<link rel="stylesheet" href="css/site.css?v=4">
<style>
  h1 { font-size: 1.6rem; margin: 0 0 4px; }
  .intro { color: var(--muted); margin: 0 0 18px; font-size: 0.92rem; }

  /* Lista de eventos */
  .controles-eventos { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin-bottom: 14px; }
  .controles-eventos select, .controles-eventos input {
    background: var(--card-bg); color: var(--text); border: 1px solid var(--grid-line); border-radius: 8px;
    padding: 8px 10px; font: inherit; font-size: 0.92rem;
  }
  .controles-eventos input { flex: 1 1 220px; max-width: 360px; }
  .controles-eventos select:focus, .controles-eventos input:focus { outline: 2px solid var(--azul); outline-offset: 1px; }
  .lista-eventos { list-style: none; margin: 0; padding: 0; background: var(--card-bg); border: 1px solid var(--grid-line); border-radius: var(--raio); overflow: hidden; }
  .lista-eventos li + li { border-top: 1px solid var(--grid-line); }
  .lista-eventos a.evento {
    display: grid; grid-template-columns: 92px minmax(0, 1fr) minmax(0, 1.3fr) 70px; gap: 14px; align-items: center;
    padding: 12px 16px; text-decoration: none;
  }
  .lista-eventos a.evento:hover, .lista-eventos a.evento:focus-visible { background: var(--card-hover); outline: none; }
  .evento .data { color: var(--muted); font-size: 0.85rem; font-variant-numeric: tabular-nums; }
  .evento .nome-evento { font-weight: 600; }
  .evento .melhor-nota { display: flex; align-items: center; gap: 4px; flex-wrap: wrap; font-weight: 400; font-size: 0.78rem; color: var(--muted); margin-top: 3px; }
  .evento .melhor-nota .selo-nota { height: 20px; min-width: 30px; font-size: 0.74rem; }
  .placar .selos { display: flex; align-items: center; gap: 6px; flex-shrink: 0; }
  .placar .lado.direita .selos { flex-direction: row-reverse; }
  .evento .principal { display: flex; align-items: center; gap: 8px; min-width: 0; font-size: 0.88rem; }
  .evento .principal .x { color: var(--muted); font-size: 0.75rem; }
  .evento .principal .lado { display: flex; align-items: center; gap: 8px; min-width: 0; }
  .evento .principal .lado span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .evento .principal .lado.venceu span { font-weight: 700; }
  .evento .qtd { color: var(--muted); font-size: 0.8rem; text-align: right; }
  .vazio { color: var(--muted); padding: 16px; }

  /* Card de um evento */
  .voltar { color: var(--muted); text-decoration: none; font-size: 0.88rem; }
  .voltar:hover { color: var(--text); }
  .cabecalho-evento { margin: 10px 0 18px; }
  .cabecalho-evento .sub { color: var(--muted); }
  .lutas { display: flex; flex-direction: column; gap: 10px; }
  .luta {
    background: var(--card-bg); border: 1px solid var(--grid-line); border-radius: var(--raio);
    padding: 12px 16px;
  }
  .luta .rotulo-luta { color: var(--muted); font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 8px; display: flex; flex-wrap: wrap; gap: 4px 10px; align-items: center; }
  .luta .rotulo-luta .etiqueta { margin: 0; }
  .placar { display: grid; grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr); gap: 16px; align-items: center; }
  .placar .lado { display: flex; align-items: center; gap: 12px; min-width: 0; }
  .placar .lado.direita { flex-direction: row-reverse; text-align: right; }
  .placar .lado.direita .identificacao { align-items: flex-end; }
  .placar .lado.perdeu > :not(.selos), .placar .lado.perdeu .resultado { opacity: 0.55; } /* a nota fica nítida */
  .placar .lado .nome-lutador { font-size: 1rem; }
  .placar .centro { text-align: center; min-width: 140px; }
  .placar .centro .metodo { font-weight: 700; }
  .placar .centro .detalhe { color: var(--muted); font-size: 0.8rem; }
  .estat-luta { display: flex; justify-content: center; flex-wrap: wrap; gap: 4px 18px; margin-top: 10px; padding-top: 8px; border-top: 1px solid var(--grid-line); color: var(--muted); font-size: 0.8rem; font-variant-numeric: tabular-nums; }
  .estat-luta strong { color: var(--text); }

  @media (max-width: 760px) {
    .lista-eventos a.evento { grid-template-columns: minmax(0, 1fr) auto; gap: 4px 12px; }
    .evento .data { grid-column: 1; grid-row: 1; }
    .evento .qtd { grid-column: 2; grid-row: 1; }
    .evento .nome-evento { grid-column: 1 / -1; }
    .evento .principal { grid-column: 1 / -1; }
    .placar { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 10px; }
    .placar .centro { grid-column: 1 / -1; grid-row: 2; min-width: 0; }
    .placar .lado { display: grid; grid-template-columns: 36px minmax(0, 1fr); gap: 6px 8px; align-items: center; }
    .placar .lado.direita { grid-template-columns: minmax(0, 1fr) 36px; }
    .placar .lado.direita .avatar { grid-column: 2; grid-row: 1; }
    .placar .lado.direita .identificacao { grid-column: 1; grid-row: 1; }
    .placar .lado .selos { grid-column: 1 / -1; }
    .placar .lado.direita .selos { justify-content: flex-start; }
    .placar .lado .avatar { width: 36px; height: 36px; }
    .placar .lado .nome-lutador { font-size: 0.92rem; overflow-wrap: anywhere; }
  }
  .posicao-elo { color: var(--text); font-weight: 600; font-variant-numeric: tabular-nums; }
</style>
</head>
<body data-pagina="eventos">

<main id="eventos">
  <p class="carregando">Carregando…</p>
</main>

</html>
